blueprint:
  name: Pet Care – dose reminder
  description: >
    Sends a notification to your household's phones when a Pet Care medication
    is overdue, with **Given**, **Snooze** and **Skip** buttons. Pick one or
    more medications; each gets its own notification.


    - **Given** logs the dose in the name of whoever tapped it.

    - **Snooze** hides the notification until the next reminder.

    - **Skip** skips this dose without using stock.


    The notification disappears from every phone as soon as the dose is given,
    in the notification or anywhere else, so nobody gives it twice. Without an
    answer it reminds again until the dose is given.


    Step-by-step setup: https://krak3n22.github.io/ha-pet-care/guide.html#reminders
  domain: automation
  source_url: https://github.com/Krak3N22/ha-pet-care/blob/main/blueprints/automation/pet_care/dose_reminder.yaml
  homeassistant:
    min_version: "2025.3.0"
  input:
    medications:
      name: Medications
      icon: mdi:medication
      input:
        overdue_sensors:
          name: Overdue sensors
          description: The *Overdue* sensor of each medication to remind about.
          selector:
            entity:
              multiple: true
              filter:
                - integration: pet_care
                  domain: binary_sensor
    phones:
      name: Phones
      icon: mdi:cellphone
      input:
        notify_devices:
          name: Phones to notify
          description: Phones with the Home Assistant app.
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app
    timing:
      name: Timing
      icon: mdi:timer-outline
      input:
        delay:
          name: Wait before the first reminder
          description: Minutes after the dose is due.
          default: 0
          selector:
            number:
              min: 0
              max: 240
              unit_of_measurement: min
              mode: box
        repeat_every:
          name: Remind again every
          description: Minutes between reminders until the dose is given. Snooze waits until the next one.
          default: 30
          selector:
            number:
              min: 5
              max: 720
              unit_of_measurement: min
              mode: box
        max_reminders:
          name: Maximum reminders
          description: 0 = keep reminding until the dose is given or skipped.
          default: 6
          selector:
            number:
              min: 0
              max: 50
              mode: box
    texts:
      name: Texts
      icon: mdi:translate
      collapsed: true
      input:
        message:
          name: Message
          description: The title is the medication's name, e.g. "Freja Inhaler".
          default: Time for the next dose.
          selector:
            text:
        given_text:
          name: Given button
          default: Given
          selector:
            text:
        snooze_text:
          name: Snooze button
          default: Snooze
          selector:
            text:
        skip_text:
          name: Skip button
          default: Skip
          selector:
            text:

# One reminder loop per overdue medication; answers are handled in runs of their own.
mode: parallel
max: 50

triggers:
  - trigger: state
    entity_id: !input overdue_sensors
    to: "on"
    for:
      minutes: !input delay
    id: due
  - trigger: state
    entity_id: !input overdue_sensors
    to: "off"
    id: done
  - trigger: event
    event_type: mobile_app_notification_action
    id: answer
  # After a restart, start reminding again for doses that are still overdue.
  - trigger: homeassistant
    event: start
    id: start
  - trigger: event
    event_type: pet_care_reminder_resume
    id: resume

variables:
  sensors: !input overdue_sensors
  devices: !input notify_devices
  repeat_every: !input repeat_every
  max_reminders: !input max_reminders
  message: !input message
  given_text: !input given_text
  snooze_text: !input snooze_text
  skip_text: !input skip_text
  # Answers look like PET_CARE_GIVEN_binary_sensor.freja_inhaler_overdue.
  answer_action: "{{ (trigger.event.data.action | default('')) if trigger.id == 'answer' else '' }}"
  answer: "{{ answer_action.split('_')[2] | lower if answer_action.startswith('PET_CARE_') else '' }}"
  sensor: >-
    {% if trigger.id in ['due', 'done'] %}{{ trigger.entity_id }}
    {%- elif trigger.id == 'resume' %}{{ trigger.event.data.entity_id | default('') }}
    {%- elif answer %}{{ answer_action.split('_', 3)[3] }}
    {%- endif %}
  tag: "pet_care_{{ sensor }}"

conditions:
  # Ignore other notifications and other automations' medications.
  - condition: template
    value_template: "{{ trigger.id == 'start' or sensor in sensors }}"

actions:
  - choose:
      - alias: Due, or still due after a restart
        conditions: "{{ trigger.id in ['due', 'resume'] }}"
        sequence:
          - variables:
              title: "{{ device_attr(device_id(sensor), 'name') or state_attr(sensor, 'friendly_name') }}"
          - repeat:
              sequence:
                - repeat:
                    for_each: "{{ devices }}"
                    sequence:
                      - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                        continue_on_error: true
                        data:
                          title: "{{ title }}"
                          message: "{{ message }}"
                          data:
                            tag: "{{ tag }}"
                            actions:
                              - action: "PET_CARE_GIVEN_{{ sensor }}"
                                title: "{{ given_text }}"
                              - action: "PET_CARE_SNOOZE_{{ sensor }}"
                                title: "{{ snooze_text }}"
                              - action: "PET_CARE_SKIP_{{ sensor }}"
                                title: "{{ skip_text }}"
                - wait_template: "{{ is_state(sensor, 'off') }}"
                  timeout: "{{ (repeat_every | int) * 60 }}"
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: >
                    {{ is_state(sensor, 'off')
                       or (max_reminders | int > 0 and repeat.index >= max_reminders | int) }}

      - alias: Answered "Given"
        conditions: "{{ answer == 'given' }}"
        sequence:
          - action: pet_care.give_dose
            continue_on_error: true
            target:
              entity_id: "{{ sensor }}"
            data:
              user_id: "{{ trigger.event.context.user_id }}"

      - alias: Answered "Skip"
        conditions: "{{ answer == 'skip' }}"
        sequence:
          - action: pet_care.skip
            continue_on_error: true
            target:
              entity_id: "{{ sensor }}"
            data:
              user_id: "{{ trigger.event.context.user_id }}"

      - alias: Given, skipped or snoozed - remove it from every phone
        conditions: "{{ trigger.id == 'done' or answer == 'snooze' }}"
        sequence:
          - repeat:
              for_each: "{{ devices }}"
              sequence:
                - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                  continue_on_error: true
                  data:
                    message: clear_notification
                    data:
                      tag: "{{ tag }}"

      - alias: Home Assistant started
        conditions: "{{ trigger.id == 'start' }}"
        sequence:
          - repeat:
              for_each: "{{ sensors | select('is_state', 'on') | list }}"
              sequence:
                - event: pet_care_reminder_resume
                  event_data:
                    entity_id: "{{ repeat.item }}"
